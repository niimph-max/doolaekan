# สร้างเว็บจากโค้ดแล้วเอาขึ้น GitHub Pages ทุกครั้งที่มีการ push
# ตั้งค่าที่ต้องทำครั้งเดียวใน repo (ดู README):
#   Settings → Pages → Source = GitHub Actions
#   Settings → Secrets and variables → Actions → เพิ่ม 2 secret ข้างล่าง
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/yangai-tao-cwds0x]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ทีละรอบ รอบใหม่มาระหว่างรอบเก่ายังไม่จบให้ยกเลิกรอบเก่า
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ── สวิตช์ย้ายไปโดเมนของตัวเอง ──
      # ยังไม่มีไฟล์ public/CNAME = เสิร์ฟที่ /<ชื่อ repo>/ บน github.io เหมือนเดิม
      # วางไฟล์ public/CNAME ที่มีชื่อโดเมนบรรทัดเดียวเมื่อไหร่ (ดู CNAME.example)
      # deploy รอบถัดไปจะสลับไปเสิร์ฟที่รากโดเมนนั้นให้เอง และ GitHub Pages อ่าน
      # ไฟล์เดียวกันนี้เป็นค่า custom domain ด้วย จึงไม่มีทางตั้งสองที่แล้วไม่ตรงกัน
      # ── คำนวณด้วย shell ห้ามใช้สูตร ${{ }} แบบสามทาง ──
      # เดิมเขียนว่า  ${{ env.CUSTOM_DOMAIN != '' && '' || format('/{0}', ...) }}
      # ซึ่งเป็นกับดักคลาสสิก: ค่ากลางเป็นค่าว่าง ซึ่ง GitHub Actions นับเป็นเท็จ
      # สูตรจึงตกไปใช้ค่าหลังสุดเสมอ ไม่มีทางได้ค่าว่างเลยสักครั้ง
      # ผลคือมีไฟล์ CNAME แล้วแต่ basePath ยังเป็น /<ชื่อ repo> อยู่ หน้าเว็บเลย
      # สั่งไปโหลด /<ชื่อ repo>/_next/... ขณะที่ไฟล์จริงอยู่ที่ราก → 404 ทุกไฟล์
      # → แอปไม่เริ่มทำงาน ค้างที่หน้า "กำลังเปิดสมุด…" โดยไม่มี error อะไรเลย
      - name: อ่านโดเมนจาก CNAME แล้วตั้ง basePath
        run: |
          DOMAIN=$(cat public/CNAME 2>/dev/null | tr -d '[:space:]')
          echo "CUSTOM_DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          if [ -n "$DOMAIN" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "โดเมนของตัวเอง: $DOMAIN — เสิร์ฟที่ราก basePath ว่าง"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "ไม่มี CNAME — เสิร์ฟที่ /${{ github.event.repository.name }}/ บน github.io"
          fi

      # ไม่มี secret แล้ว build ผ่านได้เหมือนกัน แต่จะได้แอปโหมดเครื่องเดียวที่ต่อคลาวด์ไม่ได้
      # ถ้าปล่อยไป ผู้ใช้จะเจอหน้า onboarding แทนหน้าเข้าสู่ระบบโดยไม่รู้สาเหตุ — หยุดตรงนี้ดีกว่า
      - name: ตรวจว่าใส่ secret ครบ
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          if [ -z "$URL" ]; then
            echo "::error::ไม่พบ secret NEXT_PUBLIC_SUPABASE_URL"
            missing=1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::ไม่พบ secret NEXT_PUBLIC_SUPABASE_ANON_KEY"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::เพิ่มที่ Settings → Secrets and variables → Actions → New repository secret แล้วสั่งรันใหม่"
            exit 1
          fi
          echo "secret ครบ (คีย์ยาว ${#KEY} ตัวอักษร)"

      - name: Build
        env:
          # NEXT_PUBLIC_BASE_PATH ตั้งมาจากขั้นตอนข้างบนแล้ว ผ่าน GITHUB_ENV
          # ประทับเลขรุ่นไว้ในตัวแอป จะได้ตอบได้ว่าเครื่องนี้กำลังรันของรอบไหน
          NEXT_PUBLIC_BUILD: ${{ github.run_number }}·${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # กุญแจสาธารณะ VAPID — ไม่ใส่ = เรื่องแจ้งเตือนหายไปจากแอปเงียบๆ ตั้งใจให้เป็นแบบนั้น
          # จะได้เปิดใช้วันที่พร้อมจริงโดยไม่ต้องแก้โค้ด (ใส่ secret แล้ว deploy รอบเดียว)
          # ตัวนี้เป็นกุญแจ "สาธารณะ" จริงๆ ฝังในหน้าเว็บได้ ตัวลับอยู่ที่ Edge Function เท่านั้น
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: npm run build

      # กัน Jekyll ทิ้งโฟลเดอร์ _next (ชื่อขึ้นต้นด้วย _ จะถูกข้าม)
      # ประทับเลข build ลงใน service worker ทุก deploy จะได้มีตัวใหม่ให้เบราว์เซอร์
      # ติดตั้งเสมอ ไม่งั้นเครื่องที่แคชไว้จะไม่รู้เลยว่ามีของใหม่
      - name: ประทับเลขรุ่นลง service worker
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/" out/sw.js
          grep -q "const BUILD = '${{ github.run_number }}'" out/sw.js \
            || { echo "::error::ประทับเลขรุ่นลง sw.js ไม่สำเร็จ"; exit 1; }

      # ── ด่านตรวจว่าหน้าเว็บชี้ไฟล์ถูกที่จริง ──
      # ความผิดพลาดแบบนี้ไม่มีอะไรเตือนเลย build ผ่าน deploy ผ่าน หน้าเว็บเปิดขึ้น
      # แต่ไฟล์ทุกอันตอบ 404 แล้วแอปค้างที่หน้ากำลังโหลดโดยไม่มี error
      # กว่าจะรู้ว่าพังคือตอนที่คนทั้งบ้านใช้ไม่ได้แล้ว จึงต้องตรวจตรงนี้ทุกครั้ง
      - name: ตรวจว่าหน้าเว็บชี้ไฟล์ถูกที่
        run: |
          want="${NEXT_PUBLIC_BASE_PATH}/_next/"
          if ! grep -q "\"${want}" out/index.html; then
            echo "::error::index.html ไม่ได้ชี้ไปที่ ${want} — basePath กับตำแหน่งที่จะวางไม่ตรงกัน"
            echo "ที่พบจริงในหน้าเว็บ:"
            grep -o '"[^"]*_next/static/chunks/[^"]*"' out/index.html | head -3
            exit 1
          fi
          echo "หน้าเว็บชี้ไปที่ ${want} ถูกต้อง"

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
