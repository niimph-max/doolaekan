# สร้างเว็บจากโค้ดแล้วเอาขึ้น GitHub Pages ทุกครั้งที่มีการ push
# ตั้งค่าที่ต้องทำครั้งเดียวใน repo (ดู README):
#   Settings → Pages → Source = GitHub Actions
#   Settings → Secrets and variables → Actions → เพิ่ม 2 secret ข้างล่าง
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/yangai-tao-cwds0x]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ทีละรอบ รอบใหม่มาระหว่างรอบเก่ายังไม่จบให้ยกเลิกรอบเก่า
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ── สวิตช์ย้ายไปโดเมนของตัวเอง ──
      # ยังไม่มีไฟล์ public/CNAME = เสิร์ฟที่ /<ชื่อ repo>/ บน github.io เหมือนเดิม
      # วางไฟล์ public/CNAME ที่มีชื่อโดเมนบรรทัดเดียวเมื่อไหร่ (ดู CNAME.example)
      # deploy รอบถัดไปจะสลับไปเสิร์ฟที่รากโดเมนนั้นให้เอง และ GitHub Pages อ่าน
      # ไฟล์เดียวกันนี้เป็นค่า custom domain ด้วย จึงไม่มีทางตั้งสองที่แล้วไม่ตรงกัน
      - name: อ่านโดเมนจาก CNAME
        run: echo "CUSTOM_DOMAIN=$(cat public/CNAME 2>/dev/null | tr -d '[:space:]')" >> "$GITHUB_ENV"

      # ไม่มี secret แล้ว build ผ่านได้เหมือนกัน แต่จะได้แอปโหมดเครื่องเดียวที่ต่อคลาวด์ไม่ได้
      # ถ้าปล่อยไป ผู้ใช้จะเจอหน้า onboarding แทนหน้าเข้าสู่ระบบโดยไม่รู้สาเหตุ — หยุดตรงนี้ดีกว่า
      - name: ตรวจว่าใส่ secret ครบ
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          if [ -z "$URL" ]; then
            echo "::error::ไม่พบ secret NEXT_PUBLIC_SUPABASE_URL"
            missing=1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::ไม่พบ secret NEXT_PUBLIC_SUPABASE_ANON_KEY"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::เพิ่มที่ Settings → Secrets and variables → Actions → New repository secret แล้วสั่งรันใหม่"
            exit 1
          fi
          echo "secret ครบ (คีย์ยาว ${#KEY} ตัวอักษร)"

      - name: Build
        env:
          # โดเมนของตัวเองเสิร์ฟที่ราก ส่วน github.io เสิร์ฟที่ /<ชื่อ repo>/
          # อ่านจากไฟล์ CNAME ให้เป็นค่าเดียวกันเสมอ ถ้าตั้งสองที่แล้วไม่ตรงกัน
          # ไฟล์ทั้งเว็บจะชี้ผิดที่ทั้งหมดและเปิดไม่ขึ้นเลยสักหน้า
          NEXT_PUBLIC_BASE_PATH: ${{ env.CUSTOM_DOMAIN != '' && '' || format('/{0}', github.event.repository.name) }}
          # ประทับเลขรุ่นไว้ในตัวแอป จะได้ตอบได้ว่าเครื่องนี้กำลังรันของรอบไหน
          NEXT_PUBLIC_BUILD: ${{ github.run_number }}·${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # กัน Jekyll ทิ้งโฟลเดอร์ _next (ชื่อขึ้นต้นด้วย _ จะถูกข้าม)
      # ประทับเลข build ลงใน service worker ทุก deploy จะได้มีตัวใหม่ให้เบราว์เซอร์
      # ติดตั้งเสมอ ไม่งั้นเครื่องที่แคชไว้จะไม่รู้เลยว่ามีของใหม่
      - name: ประทับเลขรุ่นลง service worker
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/" out/sw.js
          grep -q "const BUILD = '${{ github.run_number }}'" out/sw.js \
            || { echo "::error::ประทับเลขรุ่นลง sw.js ไม่สำเร็จ"; exit 1; }

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
